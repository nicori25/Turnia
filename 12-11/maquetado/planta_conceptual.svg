th="140" height="110" rx="8" fill="#e2e6ed"/><text x="645" y="870" fill="#17263e" font-family="Arial, sans-serif" font-size="22" font-weight="700">ESPERA</text><path d="M500 960V450" stroke="#2ea37f" stroke-width="4" stroke-dasharray="12 9"/><path d="M485 470L500 445L515 470" fill="none" stroke="#2ea37f" stroke-width="4"/><rect x="450" y="987" width="100" height="24" fill="#faf8f3"/><text x="430" y="1045" fill="#17263e" font-family="Arial, sans-serif" font-size="23" font-weight="700">ACCESO</text><path d="M200 165H800 M200 150V180 M800 150V180 M850 200V1000 M835 200H865 M835 1000H865" stroke="#59677b" stroke-width="2"/><text x="470" y="151" fill="#17263e" font-family="Arial, sans-serif" font-size="23" font-weight="400">6 m</text><text x="880" y="610" fill="#17263e" font-family="Arial, sans-serif" font-size="23" font-weight="400">8 m</text><text x="70" y="1130" fill="#59677b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Orientación convencional. Distribución ilustrativa; puertas e instalaciones pendientes.</text><text x="70" y="1170" fill="#59677b" font-family="Arial, sans-serif" font-size="19" font-weight="400">Verificar medidas, accesibilidad, ventilación y evacuación con un profesional.</text></svg>