<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img"><title>02_Historia_Turnia.svg</title><rect width="100%" height="100%" fill="#1c1b19"/><rect x="0" y="0" width="1080" height="28" fill="#d16a44"/><text x="85" y="170" fill="#2ea37f" font-family="Arial, sans-serif" font-size="52" font-weight="700">TURNIA</text><text x="85" y="400" fill="#f4efe3" font-family="Arial, sans-serif" font-size="92" font-weight="700">Tu próxima</text><text x="85" y="510" fill="#f4efe3" font-family="Arial, sans-serif" font-size="92" font-weight="700">idea para</text><text x="85" y="620" fill="#f4efe3" font-family="Arial, sans-serif" font-size="92" font-weight="700">organizar</text><text x="85" y="730" fill="#f4efe3" font-family="Arial, sans-serif" font-size="92" font-weight="700">turnos.</text><text x="85" y="905" fill="#f4efe3" font-family="Arial, sans-serif" font-size="39" font-weight="400">Conocé el recorrido de reserva</text><text x="85" y="965" fill="#f4efe3" font-family="Arial, sans-serif" font-size="39" font-weight="400">y la vista del barbero.</text><rect x="85" y="1090" width="910" height="270" rx="24" fill="#242320"/><text x="130" y="1170" fill="#2ea37f" font-family="Arial, sans-serif" font-size="28" font-weight="700">CLIENTE</text><text x="130" y="1235" fill="#f4efe3" font-family="Arial, sans-serif" font-size="44" font-weight="400">Servicio + horario</text><text x="130" y="1310" fill="#d16a44" font-family="Arial, sans-serif" font-size="28" font-weight="400">ADMINISTRACIÓN · VISTA DE EJEMPLO</text><rect x="85" y="1480" width="910" height="105" rx="52" fill="#2ea37f"/><text x="275" y="1548" fill="#0d1e18" font-family="Arial, sans-serif" font-size="44" font-weight="700">Conocé Turnia</text><text x="85" y="1730" fill="#d16a44" font-family="Arial, sans-serif" font-size="30" font-weight="700">PROTOTIPO</text><text x="85" y="1790" fill="#bcb4a4" font-family="Arial, sans-serif" font-size="30" font-weight="400">Sin reservas reales desde esta