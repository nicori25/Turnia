name: Deploy main to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check dates, database rules and permissions
        run: npm test
      - name: Build Vue app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ROUTER_MODE: hash
        run: |
          # Empty Actions variables must not override the public .env file.
          if [ -z "$VITE_SUPABASE_URL" ]; then unset VITE_SUPABASE_URL; fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then unset VITE_SUPABASE_ANON_KEY; fi
          node --input-type=module <<'JS'
          import { loadEnv } from 'vite'
          const config = loadEnv('production', process.cwd(), 'VITE_')
          if (!config.VITE_SUPABASE_URL || !config.VITE_SUPABASE_ANON_KEY) {
            throw new Error('Falta la configuración pública de Supabase en .env o Actions.')
          }
          const url = new URL(config.VITE_SUPABASE_URL)
          if (url.protocol !== 'https:') throw new Error('La URL de Supabase debe usar HTTPS.')
          JS
          npm run build -- --base "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
