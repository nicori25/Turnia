name: Deploy App to GitHub Pages

on:
  push:
    branches: [App]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/App'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci --no-audit --no-fund
      - name: Export Expo web
        env:
          EXPO_NO_TELEMETRY: '1'
          TURNIA_WEB_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run build:web
          # Preserve direct access and reloads on routes without .html.
          find dist -name '*.html' ! -name index.html ! -name '+not-found.html' -print0 |
          while IFS= read -r -d '' page; do
            mkdir -p "${page%.html}"
            cp "$page" "${page%.html}/index.html"
          done
          cp dist/+not-found.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
